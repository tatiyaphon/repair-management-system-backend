<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตั้งรหัสผ่านใหม่ | ระบบจัดการงานซ่อม</title>

<link
  href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"
  rel="stylesheet"
>

<style>

body {

    margin: 0;

    font-family: 'Kanit', sans-serif;

    background: linear-gradient(
        135deg,
        #16a34a,
        #22c55e
    );

    display: flex;

    align-items: center;

    justify-content: center;

    height: 100vh;
}


.card {

    background: #fff;

    padding: 40px;

    width: 100%;

    max-width: 420px;

    border-radius: 20px;

    box-shadow: 0 25px 60px rgba(0,0,0,.2);

    box-sizing: border-box;
}


h2 {

    text-align: center;

    margin-bottom: 10px;
}


p {

    text-align: center;

    color: #6b7280;

    font-size: .9rem;
}


.input-group {

    margin-top: 20px;
}


.input-group label {

    display: block;

    margin-bottom: 8px;

    font-size: .9rem;

    font-weight: 500;

    color: #374151;
}


input {

    width: 100%;

    padding: 14px;

    border-radius: 12px;

    border: 1px solid #e5e7eb;

    font-size: 1rem;

    font-family: 'Kanit', sans-serif;

    box-sizing: border-box;
}


input:focus {

    outline: none;

    border-color: #16a34a;

    box-shadow: 0 0 0 3px rgba(22,163,74,.2);
}


input.error {

    border-color: #dc2626;

    box-shadow: 0 0 0 3px rgba(220,38,38,.1);
}


input.success {

    border-color: #16a34a;

    box-shadow: 0 0 0 3px rgba(22,163,74,.1);
}


.message {

    display: none;

    margin-top: 8px;

    font-size: .85rem;

    color: #dc2626;
}


button {

    width: 100%;

    margin-top: 25px;

    padding: 14px;

    border: none;

    border-radius: 14px;

    background: #16a34a;

    color: #fff;

    font-weight: 600;

    font-size: 1rem;

    font-family: 'Kanit', sans-serif;

    cursor: pointer;
}


button:hover {

    background: #15803d;
}


button:disabled {

    background: #9ca3af;

    cursor: not-allowed;
}

</style>

</head>


<body>


<div class="card">

    <h2>
        ตั้งรหัสผ่านใหม่
    </h2>


    <p>
        กรอกรหัสผ่านใหม่ของคุณ
    </p>


    <!-- รหัสผ่านใหม่ -->

    <div class="input-group">

        <label for="password">
            รหัสผ่านใหม่
        </label>

        <input
            type="password"
            id="password"
            placeholder="กรอกรหัสผ่านใหม่"
            autocomplete="new-password"
        >

    </div>


    <!-- ยืนยันรหัสผ่าน -->

    <div class="input-group">

        <label for="confirmPassword">
            ยืนยันรหัสผ่านใหม่
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
            autocomplete="new-password"
        >

        <div
            class="message"
            id="passwordMessage"
        >
            รหัสผ่านไม่ตรงกัน
        </div>

    </div>


    <button
        id="resetButton"
        onclick="resetPassword()"
    >
        ยืนยันการเปลี่ยนรหัส
    </button>

</div>


<script>


/* =========================================
   ตรวจสอบรหัสผ่านว่าตรงกัน
========================================= */

function checkPasswordMatch() {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("passwordMessage");

    const confirmInput =
        document.getElementById("confirmPassword");


    if (!confirmPassword) {

        message.style.display = "none";

        confirmInput.classList.remove("error");

        confirmInput.classList.remove("success");

        return false;
    }


    if (password !== confirmPassword) {

        message.textContent =
            "รหัสผ่านไม่ตรงกัน";

        message.style.display =
            "block";

        confirmInput.classList.add("error");

        confirmInput.classList.remove("success");

        return false;
    }


    message.style.display =
        "none";

    confirmInput.classList.remove("error");

    confirmInput.classList.add("success");

    return true;
}


/* =========================================
   ตรวจสอบตอนพิมพ์
========================================= */

document
    .getElementById("password")
    .addEventListener("input", checkPasswordMatch);


document
    .getElementById("confirmPassword")
    .addEventListener("input", checkPasswordMatch);


/* =========================================
   RESET PASSWORD
========================================= */

async function resetPassword() {

    const token =
        new URLSearchParams(
            window.location.search
        ).get("token");


    const password =
        document
            .getElementById("password")
            .value
            .trim();


    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value
            .trim();


    const button =
        document.getElementById("resetButton");


    /* =====================================
       ตรวจสอบ Token
    ===================================== */

    if (!token) {

        alert(
            "ไม่พบลิงก์สำหรับรีเซ็ตรหัสผ่าน"
        );

        return;
    }


    /* =====================================
       ตรวจสอบรหัสผ่าน
    ===================================== */

    if (!password) {

        alert(
            "กรุณากรอกรหัสผ่านใหม่"
        );

        document
            .getElementById("password")
            .focus();

        return;
    }


    if (password.length < 6) {

        alert(
            "รหัสผ่านต้องอย่างน้อย 6 ตัวอักษร"
        );

        document
            .getElementById("password")
            .focus();

        return;
    }


    /* =====================================
       ตรวจสอบการยืนยันรหัสผ่าน
    ===================================== */

    if (!confirmPassword) {

        alert(
            "กรุณายืนยันรหัสผ่านใหม่อีกครั้ง"
        );

        document
            .getElementById("confirmPassword")
            .focus();

        return;
    }


    if (password !== confirmPassword) {

        alert(
            "รหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง"
        );

        document
            .getElementById("confirmPassword")
            .focus();

        return;
    }


    /* =====================================
       ป้องกันกดปุ่มซ้ำ
    ===================================== */

    button.disabled = true;

    button.textContent =
        "กำลังเปลี่ยนรหัสผ่าน...";


    try {


        /* =================================
           ส่งข้อมูลไป Backend
        ================================= */

        const res = await fetch(
            `/api/auth/reset-password/${token}`,
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    password: password

                })

            }
        );


        const data =
            await res.json();


        /* =================================
           กรณีเกิดข้อผิดพลาด
        ================================= */

        if (!res.ok) {

            alert(
                data.message ||
                "ลิงก์หมดอายุหรือไม่ถูกต้อง"
            );

            button.disabled = false;

            button.textContent =
                "ยืนยันการเปลี่ยนรหัส";

            return;
        }


        /* =================================
           สำเร็จ
        ================================= */

        alert(
            "เปลี่ยนรหัสผ่านสำเร็จ"
        );


        window.location.href =
            "login.html";


    } catch (err) {

        console.error(
            "Reset password error:",
            err
        );


        alert(
            "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"
        );


        button.disabled = false;

        button.textContent =
            "ยืนยันการเปลี่ยนรหัส";

    }

}

</script>


</body>

</html>
